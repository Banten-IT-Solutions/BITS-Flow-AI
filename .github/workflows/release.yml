name: Release

# Two-step flow (same pattern as BITS-AI-Video-Creator):
# 1. `semantic-release.yml` runs on push to main: it versions the app from
#    Conventional Commits, tags `${version}` (bare semver, no `v` prefix),
#    publishes the GitHub Release with generated notes, and dispatches this
#    workflow with the tag name (tags created with GITHUB_TOKEN do not
#    trigger tag-push events).
# 2. This workflow validates the tag, builds the Linux bundles with
#    tauri-action, and uploads the `.deb` and `.AppImage` assets to the
#    existing release. If the release does not exist (manual tag push),
#    tauri-action creates it.
# Tag format: bare semver (`1.2.3`, matching semantic-release `tagFormat`)
# or an optional `v` prefix (`v1.2.3`); the prefix is stripped below.

on:
  push:
    tags:
      - "[0-9]*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example 1.2.3 or v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish Linux bundles
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${TAG_NAME#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag '$TAG': expected MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            echo "Tag '$TAG' does not exist in the repository." >&2
            exit 1
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Align release version
        run: node scripts/set-release-version.mjs "${{ steps.meta.outputs.version }}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.meta.outputs.version }}
          releaseName: "BITS Flow AI ${{ steps.meta.outputs.version }}"
          releaseBody: "See the assets below to download. `.deb` for Debian/Ubuntu, `.AppImage` for other distributions."
          releaseDraft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
