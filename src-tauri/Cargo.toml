[package]
name = "bits-flow-ai"
version = "1.6.0"
description = "BITS Flow AI — isolated browser profiles for AI providers"
authors = ["Banten IT Solutions"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bits_flow_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"

# GTK layout fix for persona child webviews (Window::default_vbox packing).
# Must match the gtk version tauri/wry already links (0.18.x).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
